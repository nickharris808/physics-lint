site_name: Is this model physically possible?
site_description: >-
  Eleven open-source tools that check whether an S-parameter model, a coupling
  extractor, or a machine-learned surrogate describes something that could
  exist. Every one is a grader: it can prove a model wrong and never right.
site_url: https://nickharris808.github.io/physics-lint/
repo_url: https://github.com/nickharris808/physics-lint
repo_name: nickharris808/physics-lint
copyright: Apache-2.0 (code) / CC-BY-4.0 (data) — ChipletOS / Genesis contributors

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: red
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: red
      toggle: { icon: material/weather-sunny, name: Light mode }

nav:
  - Start here: index.md
  - What this proves: scope.md
  - The concepts: concepts.md
  - Walkthrough: tutorial.md
  - FAQ: faq.md
  - Architecture: architecture.md
  - The artifacts: artifacts.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc: { permalink: true }
  - pymdownx.superfences
  - pymdownx.details

plugins:
  - search
