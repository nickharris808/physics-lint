[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physics-lint"
version = "0.1.0"
description = "One command for the physical-admissibility checkers: S-parameters, coupling extractors, and model abstention."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ChipletOS / Genesis contributors" }]
keywords = [
    "rf", "microwave", "signal-integrity", "touchstone", "s-parameters",
    "passivity", "physics", "linting", "sarif", "eda",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

# The three checkers are deliberately NOT hard dependencies. They are not on a
# package index yet, and a direct git URL cannot be published to PyPI, so
# declaring them here would make this package uninstallable rather than
# convenient. Instead each subcommand imports its checker lazily and, if it is
# missing, prints the exact command to install it. `pip install physics-lint`
# therefore always succeeds and never silently half-works.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
physics-lint = "physics_lint.cli:main"

[project.urls]
Homepage = "https://github.com/nickharris808/physics-lint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
